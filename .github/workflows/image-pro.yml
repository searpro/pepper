# Builds Pepper Pro's image (Dockerfile.pro) and publishes it to GHCR as
# ghcr.io/<owner>/pepper-pro, which `launch.py up --product pro` pulls. The
# build itself validates every recipe against the ComfyUI it installs, so a
# red build here is usually a recipe that no longer matches its nodes.
#
# Two builds, one per torch CUDA line. CUDA 12.8 is `latest`, for cloud hosts
# whose drivers stop short of CUDA 13. CUDA 13 is `cu130` (and `sha-…-cu130`):
# only there does comfy_kitchen have NVFP4 kernels, which the 16gb tier's
# files need on a Blackwell card (deploy/home picks it when the driver can).
name: image-pro

on:
  push:
    branches: [main]
    paths:
      - Dockerfile.pro
      - .dockerignore
      - package.json
      - package-lock.json
      - tsconfig*.json
      - packages/**
      - apps/pepper-pro/**
      - deploy/runpod/entrypoint.mjs
      - .github/workflows/image-pro.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-pro-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - cuda: cu128
            suffix: ''
            moving_tag: latest
          - cuda: cu130
            suffix: -cu130
            moving_tag: cu130
    steps:
      - uses: actions/checkout@v4

      # ComfyUI's torch and CUDA wheels are several GB; the default runner's
      # free disk is not enough for the build cache and the layer together.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-pro
          tags: |
            type=raw,value=${{ matrix.moving_tag }},enable={{is_default_branch}}
            type=sha,format=short,suffix=${{ matrix.suffix }}
            type=ref,event=branch,suffix=${{ matrix.suffix }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.pro
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: TORCH_INDEX=https://download.pytorch.org/whl/${{ matrix.cuda }}
          # One cache per CUDA line: they share no torch layers.
          cache-from: type=gha,scope=pro-${{ matrix.cuda }}
          cache-to: type=gha,mode=max,scope=pro-${{ matrix.cuda }}
